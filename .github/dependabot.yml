# Dependabot — Club LRE
# Mantiene npm actualizado y abre PRs automáticos por semana.
# Se mergean manualmente con revisión rápida (CI + changelog).

version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Argentina/Buenos_Aires'
    open-pull-requests-limit: 5
    target-branch: 'develop'
    labels:
      - 'dependencies'
    # Ignorar majors de Next y React salvo bump manual coordinado.
    ignore:
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@heroui/*'
    # Agrupar parches y minors para reducir ruido.
    groups:
      patch-and-minor:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Argentina/Buenos_Aires'
    open-pull-requests-limit: 3
    target-branch: 'develop'
    labels:
      - 'dependencies'
      - 'ci'
