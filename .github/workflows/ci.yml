name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Node primero — Node 24 viene del .nvmrc.
      # No usamos `cache: pnpm` acá porque requiere pnpm preinstalado
      # y los runners de GitHub Actions no lo traen. El cache lo maneja
      # `pnpm/action-setup` abajo con `cache: true`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # pnpm/action-setup lee el `packageManager` de package.json y
      # instala la versión correcta. No pasamos `version:` porque
      # choca con `packageManager: pnpm@X.Y.Z` del package.json
      # ("Multiple versions of pnpm specified").
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          if-no-files-found: error
          retention-days: 7
