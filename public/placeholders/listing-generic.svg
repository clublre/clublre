<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Imagen de publicación pendiente">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <pattern id="p" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0 16 L 32 16" stroke="white" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#g)" />
  <rect width="400" height="300" fill="url(#p)" />
  <g transform="translate(200 150)" fill="white" text-anchor="middle">
    <circle r="40" fill="white" fill-opacity="0.12" />
    <text y="6" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="600">Próximamente</text>
  </g>
  <text x="200" y="270" fill="white" fill-opacity="0.7" text-anchor="middle"
        font-family="ui-sans-serif, system-ui" font-size="11">
    Imagen aún no subida por el socio
  </text>
</svg>
