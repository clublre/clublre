<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Servicio entre socios">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#g)" />
  <g transform="translate(200 150)" fill="white" text-anchor="middle">
    <circle r="44" fill="white" fill-opacity="0.14" />
    <text y="6" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="600">Servicio</text>
  </g>
  <text x="200" y="270" fill="white" fill-opacity="0.75" text-anchor="middle"
        font-family="ui-sans-serif, system-ui" font-size="11">
    Clases particulares, transporte y otros servicios
  </text>
</svg>
